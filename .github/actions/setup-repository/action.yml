name: Set up Anish site repository
description: Install the repository's pinned Node, npm, and lockfile dependencies.

runs:
  using: composite
  steps:
    - name: Use repository Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: npm
    - name: Activate package-manager version
      shell: bash
      run: |
        set -euo pipefail
        package_manager="$(node -p "require('./package.json').packageManager")"
        if [[ ! "$package_manager" =~ ^npm@([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          echo "packageManager must pin an exact npm version." >&2
          exit 1
        fi
        npm_version="${BASH_REMATCH[1]}"
        npm install --global "npm@${npm_version}" --ignore-scripts
        hash -r
        test "$(npm --version)" = "$npm_version"
    - name: Install locked dependencies
      shell: bash
      run: npm ci --ignore-scripts
