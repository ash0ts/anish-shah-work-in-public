name: Browser Quality

on:
  pull_request:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA to test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: browser-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  BROWSER_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha) }}

jobs:
  classify:
    name: classify browser impact
    runs-on: ubuntu-latest
    outputs:
      run_browser: ${{ steps.changes.outputs.run_browser }}
    steps:
      - name: Check out source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BROWSER_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact commit
        env:
          EXPECTED_SHA: ${{ env.BROWSER_SOURCE_SHA }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "${#EXPECTED_SHA}" -eq 40
      - name: Classify changed paths
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run_browser=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "${#BASE_SHA}" -eq 40
          run_browser=false
          while IFS= read -r changed; do
            case "$changed" in
              docs/*|releases/*|README.md|CONTRIBUTING.md|SECURITY.md|AGENTS.md|.github/pull_request_template.md)
                ;;
              *)
                if [[ "$changed" == .agents/* ]] &&
                  [[ "$changed" == *.md || "$changed" == *.yml || "$changed" == *.yaml ]]; then
                  :
                else
                  run_browser=true
                  break
                fi
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$BROWSER_SOURCE_SHA")
          echo "run_browser=$run_browser" >> "$GITHUB_OUTPUT"

  build:
    name: build browser candidate
    if: needs.classify.outputs.run_browser == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BROWSER_SOURCE_SHA }}
          persist-credentials: false
      - name: Set up repository toolchain
        uses: ./.github/actions/setup-repository
      - name: Build browser candidate once
        run: npm run build
      - name: Upload immutable browser build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-build-${{ env.BROWSER_SOURCE_SHA }}
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  artifact_round_trip:
    name: verify browser artifact round trip
    if: needs.classify.outputs.run_browser == 'true'
    needs: [classify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BROWSER_SOURCE_SHA }}
          persist-credentials: false
      - name: Set up repository toolchain
        uses: ./.github/actions/setup-repository
      - name: Download immutable browser build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: browser-build-${{ env.BROWSER_SOURCE_SHA }}
          path: dist
      - name: Verify hidden Vite manifest and bundle closure
        run: |
          test -s dist/client/.vite/manifest.json
          npm run bundle:scan

  browser_playwright:
    name: browser ${{ matrix.scope }}
    if: needs.classify.outputs.run_browser == 'true'
    needs: [classify, artifact_round_trip]
    strategy:
      fail-fast: false
      matrix:
        scope: [classic, room-public]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BROWSER_SOURCE_SHA }}
          persist-credentials: false
      - name: Set up repository toolchain
        uses: ./.github/actions/setup-repository
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Download immutable browser build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: browser-build-${{ env.BROWSER_SOURCE_SHA }}
          path: dist
      - name: Run browser segment
        env:
          BROWSER_QUALITY_SCOPE: ${{ matrix.scope }}
        run: npm run validate:browser:segment
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-quality-${{ matrix.scope }}-failure-${{ env.BROWSER_SOURCE_SHA }}
          path: |
            .playwright/results-*
            .playwright/report-*
            .wrangler/browser-quality-*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  room_quality:
    name: room quality shard ${{ matrix.shard }} of 5
    if: needs.classify.outputs.run_browser == 'true'
    needs: [classify, artifact_round_trip]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BROWSER_SOURCE_SHA }}
          persist-credentials: false
      - name: Set up repository toolchain
        uses: ./.github/actions/setup-repository
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Download immutable browser build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: browser-build-${{ env.BROWSER_SOURCE_SHA }}
          path: dist
      - name: Run one room-quality shard
        env:
          BROWSER_QUALITY_SCOPE: room-shard
          BROWSER_QUALITY_SHARD: ${{ matrix.shard }}
        run: npm run validate:browser:segment
      - name: Upload room-shard failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: room-quality-shard-${{ matrix.shard }}-failure-${{ env.BROWSER_SOURCE_SHA }}
          path: |
            .playwright/results-*
            .playwright/report-*
            .wrangler/browser-quality-*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  lighthouse:
    name: Lighthouse budgets
    if: needs.classify.outputs.run_browser == 'true'
    needs: [classify, artifact_round_trip]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BROWSER_SOURCE_SHA }}
          persist-credentials: false
      - name: Set up repository toolchain
        uses: ./.github/actions/setup-repository
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Download immutable browser build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: browser-build-${{ env.BROWSER_SOURCE_SHA }}
          path: dist
      - name: Run Lighthouse segment
        env:
          BROWSER_QUALITY_SCOPE: lighthouse
        run: npm run validate:browser:segment
      - name: Upload Lighthouse failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-failure-${{ env.BROWSER_SOURCE_SHA }}
          path: |
            .lighthouse
            .wrangler/lighthouse-quality*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  room_review:
    name: room review
    if: needs.classify.outputs.run_browser == 'true'
    needs: [classify, artifact_round_trip]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BROWSER_SOURCE_SHA }}
          persist-credentials: false
      - name: Set up repository toolchain
        uses: ./.github/actions/setup-repository
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Download immutable browser build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: browser-build-${{ env.BROWSER_SOURCE_SHA }}
          path: dist
      - name: Capture room review evidence
        run: npm run capture:room-review
      - name: Upload browser review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: room-browser-review-${{ env.BROWSER_SOURCE_SHA }}
          path: |
            .playwright/room-review
            .playwright/results-room-review
            .playwright/report-room-review
            .wrangler/browser-quality-room-review.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  browser:
    name: browser
    if: always()
    needs:
      - classify
      - build
      - artifact_round_trip
      - browser_playwright
      - room_quality
      - lighthouse
      - room_review
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable browser gate
        env:
          RUN_BROWSER: ${{ needs.classify.outputs.run_browser }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          ARTIFACT_RESULT: ${{ needs.artifact_round_trip.result }}
          PLAYWRIGHT_RESULT: ${{ needs.browser_playwright.result }}
          ROOM_QUALITY_RESULT: ${{ needs.room_quality.result }}
          LIGHTHOUSE_RESULT: ${{ needs.lighthouse.result }}
          ROOM_REVIEW_RESULT: ${{ needs.room_review.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFY_RESULT" = "success"
          case "$RUN_BROWSER" in
            false)
              echo "Browser quality is not required for documentation-only changes."
              exit 0
              ;;
            true)
              ;;
            *)
              echo "Browser path classification did not produce true or false." >&2
              exit 1
              ;;
          esac
          test "$BUILD_RESULT" = "success"
          test "$ARTIFACT_RESULT" = "success"
          test "$PLAYWRIGHT_RESULT" = "success"
          test "$ROOM_QUALITY_RESULT" = "success"
          test "$LIGHTHOUSE_RESULT" = "success"
          test "$ROOM_REVIEW_RESULT" = "success"
