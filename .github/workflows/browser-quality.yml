name: Browser quality

on:
  pull_request:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA to test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: browser-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
          persist-credentials: false
      - name: Confirm exact commit
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
        run: |
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "${#EXPECTED_SHA}" -eq 40
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
      - name: Use pinned npm
        run: |
          npm install --global npm@11.6.2 --ignore-scripts
          hash -r
          test "$(npm --version)" = "11.6.2"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Run browser and Lighthouse gates
        run: npm run validate:browser
      - name: Capture room review evidence
        run: npm run capture:room-review
      - name: Upload browser review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: room-browser-review-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            .playwright/room-review
            .playwright/results-room
            .playwright/report-room
