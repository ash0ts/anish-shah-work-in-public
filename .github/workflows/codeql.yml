name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA to scan
        required: true
        type: string
      runner_label:
        description: Run on GitHub-hosted infrastructure or the temporary owner runner
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - anish-release
  schedule:
    - cron: "23 7 * * 2"

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: read

jobs:
  analyze:
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && inputs.runner_label == 'anish-release' && '["self-hosted","linux","x64","anish-release"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - name: Validate owner dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          REQUESTED_RUNNER_LABEL: ${{ inputs.runner_label }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$REQUESTED_RUNNER_LABEL" in
            github-hosted|anish-release) ;;
            *) exit 1 ;;
          esac
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha) }}
          persist-credentials: false
      - name: Confirm exact commit
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha) }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "${#GITHUB_SHA}" -eq 40
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          config-file: ./.github/codeql-config.yml
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          output: ${{ runner.temp }}/codeql-results
          upload: never
          upload-database: false
      - name: Enforce CodeQL findings gate
        env:
          CODEQL_SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: node scripts/check-codeql-sarif.mjs "$CODEQL_SARIF_DIR"
