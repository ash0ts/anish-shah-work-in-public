name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "worker/**"
      - "scripts/**"
      - "types/**"
      - "tests/backend-connector-privacy.test.mjs"
      - "tests/backend-security.test.mjs"
      - "tests/ci-topology.test.mjs"
      - "tests/cloudflare-access.test.mjs"
      - "tests/content-connector-artwork.test.mjs"
      - "tests/content-connectors.test.mjs"
      - "tests/content-discogs-connector.test.mjs"
      - "tests/content-discogs-oauth.test.mjs"
      - "tests/content-myanimelist-oauth.test.mjs"
      - "tests/content-privacy.test.mjs"
      - "tests/content-spotify-connector.test.mjs"
      - "tests/content-spotify-oauth.test.mjs"
      - "tests/content-steam-connector.test.mjs"
      - "tests/content-strava-config.test.mjs"
      - "tests/copy-only-lane.test.mjs"
      - "tests/play-promotion.test.mjs"
      - "tests/preview-readiness.test.mjs"
      - "tests/release-*.test.mjs"
      - "tests/security-hardening.test.mjs"
      - "tests/simulation-backend.test.mjs"
      - "tests/simulation-migrations.test.mjs"
      - "tests/simulation-play-grounding.test.mjs"
      - "tests/staging-preview.test.mjs"
      - "tests/travel-backend.test.mjs"
      - "tests/travel-migrations.test.mjs"
      - "tests/travel-security.test.mjs"
      - ".github/actions/**"
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA to scan
        required: true
        type: string
      runner_target:
        description: Hosted runner or disposable owner AMD64 runner
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - owner-amd64
      jit_label:
        description: One-time opaque runner label; required for owner-amd64
        required: false
        type: string
  schedule:
    - cron: "23 7 * * 2"

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: read

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.ref) }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.runner_target == 'owner-amd64' && format('["self-hosted","linux","x64","{0}"]', inputs.jit_label) || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - name: Validate owner dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          RUNNER_TARGET: ${{ inputs.runner_target }}
          JIT_LABEL: ${{ inputs.jit_label }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$RUNNER_TARGET" in
            github-hosted) test -z "$JIT_LABEL" ;;
            owner-amd64) [[ "$JIT_LABEL" =~ ^anish-release-[a-f0-9]{12}$ ]] ;;
            *) exit 1 ;;
          esac
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha) }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact commit
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha) }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "${#GITHUB_SHA}" -eq 40
      - name: Require the dispatched SHA to belong to the trusted release ref
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" =~ ^refs/heads/(main|release/[0-9]+\.[0-9]+\.[0-9]+)$ ]]
          branch="${GITHUB_REF#refs/heads/}"
          trusted_ref="$(git rev-parse "refs/remotes/origin/${branch}")"
          test "$EXPECTED_SHA" = "$trusted_ref"
      - name: Use the pinned repository Node before CodeQL
        if: github.event_name != 'workflow_dispatch' || inputs.runner_target != 'owner-amd64'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Verify the CodeQL runtime
        run: test "$(node --version)" = "v$(cat .node-version)"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          config-file: ./.github/codeql-config.yml
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          output: ${{ runner.temp }}/codeql-results
          upload: never
          upload-database: false
      - name: Enforce CodeQL findings gate
        env:
          CODEQL_SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: node scripts/check-codeql-sarif.mjs "$CODEQL_SARIF_DIR"
