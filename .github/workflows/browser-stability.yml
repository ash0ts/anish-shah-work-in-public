name: Browser stability soak

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character SHA for the optional exhaustive interaction soak
        required: true
        type: string
      validate_run_id:
        description: Successful Validate run containing this SHA's immutable build
        required: true
        type: string
      runner_target:
        description: Hosted runners or two disposable owner ARM64 runners
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - owner-arm64
      jit_label:
        description: One-time opaque label shared by exactly two ephemeral runners
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: browser-stability-${{ inputs.commit_sha }}
  cancel-in-progress: true

jobs:
  soak:
    name: browser soak worker ${{ matrix.worker }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        worker: [1, 2]
    runs-on: ${{ fromJSON(inputs.runner_target == 'owner-arm64' && format('["self-hosted","linux","arm64","{0}"]', inputs.jit_label) || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
      - name: Validate owner exact-SHA dispatch
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          VALIDATE_RUN_ID: ${{ inputs.validate_run_id }}
          RUNNER_TARGET: ${{ inputs.runner_target }}
          JIT_LABEL: ${{ inputs.jit_label }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VALIDATE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          case "$RUNNER_TARGET" in
            github-hosted) test -z "$JIT_LABEL" ;;
            owner-arm64) [[ "$JIT_LABEL" =~ ^anish-release-[a-f0-9]{12}$ ]] ;;
            *) exit 1 ;;
          esac
      - name: Verify the producing Validate workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ inputs.commit_sha }}
          VALIDATE_RUN_ID: ${{ inputs.validate_run_id }}
        run: |
          set -euo pipefail
          run="$(curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${VALIDATE_RUN_ID}")"
          test "$(jq -r '.path' <<<"$run")" = ".github/workflows/ci.yml"
          test "$(jq -r '.head_sha' <<<"$run")" = "$EXPECTED_SHA"
          test "$(jq -r '.conclusion' <<<"$run")" = success
          case "$(jq -r '.event' <<<"$run")" in
            workflow_dispatch|push) ;;
            *) exit 1 ;;
          esac
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact commit
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "${#GITHUB_SHA}" -eq 40
      - name: Require the candidate SHA to belong to the trusted release ref
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" =~ ^refs/heads/(main|release/[0-9]+\.[0-9]+\.[0-9]+)$ ]]
          branch="${GITHUB_REF#refs/heads/}"
          trusted_ref="$(git rev-parse "refs/remotes/origin/${branch}")"
          test "$EXPECTED_SHA" = "$trusted_ref"
      - name: Set up repository toolchain
        uses: ./.github/actions/setup-repository
      - name: Download the existing validated build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-dist-${{ inputs.commit_sha }}
          path: dist
          run-id: ${{ inputs.validate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify immutable browser candidate
        run: |
          test -s dist/client/.vite/manifest.json
          npm run deployable:attest
      - name: Install Chromium on GitHub-hosted runners
        if: inputs.runner_target == 'github-hosted'
        run: npx --no-install playwright install --with-deps chromium
      - name: Run one exhaustive interaction partition
        env:
          BROWSER_SOAK_WORKER: ${{ matrix.worker }}
          BROWSER_SOAK_LOOPS: "1"
        run: node scripts/ci/run-browser-soak.mjs
      - name: Capture non-blocking visual review evidence
        if: matrix.worker == 1
        run: npm run capture:room-review
      - name: Upload visual review evidence
        if: matrix.worker == 1 && success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: room-browser-review-${{ inputs.commit_sha }}
          path: |
            .playwright/room-review
            .playwright/results-room-review
            .playwright/report-room-review
            .wrangler/browser-quality-room-review.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload soak failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-soak-${{ matrix.worker }}-failure-${{ inputs.commit_sha }}
          path: |
            .playwright/results-*
            .playwright/report-*
            .wrangler/browser-quality-*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
