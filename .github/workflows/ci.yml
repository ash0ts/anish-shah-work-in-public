name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA to validate
        required: true
        type: string
      runner_label:
        description: Run on GitHub-hosted infrastructure or the temporary owner runner
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - anish-release

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && inputs.runner_label == 'anish-release' && 'anish-release' || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - name: Validate owner dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          REQUESTED_RUNNER_LABEL: ${{ inputs.runner_label }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$REQUESTED_RUNNER_LABEL" in
            github-hosted|anish-release) ;;
            *) exit 1 ;;
          esac
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha) }}
          persist-credentials: false
      - name: Confirm exact commit
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha) }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "${#GITHUB_SHA}" -eq 40
      - name: Set up repository toolchain
        uses: ./.github/actions/setup-repository
      - name: Validate exact commit
        run: npm run validate
      - name: Write synthetic preview metadata
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PREVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_WORKFLOW_SHA: ${{ github.sha }}
        run: npm run preview:metadata
      - name: Upload immutable preview build
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # The artifact is keyed to the exact source SHA checked out and validated.
          name: preview-build-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
