name: Deploy PR preview

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  # Eligible pull-request runs share a lock with preview cleanup. Associated
  # push runs use their run ID and cannot cancel an in-flight PR deployment.
  group: preview-${{ github.event.workflow_run.event == 'pull_request' && format('pr-{0}', github.event.workflow_run.pull_requests[0].number) || format('run-{0}', github.event.workflow_run.id) }}
  cancel-in-progress: true

jobs:
  mark_validation_failure:
    if: >-
      github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    steps:
      - name: Mark the current preview SHA as not deployable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          endpoint="repos/${GITHUB_REPOSITORY}/pulls/${PREVIEW_PR_NUMBER}"
          snapshot="$(gh api "$endpoint" --jq '[.state, .head.sha, .head.repo.full_name] | @tsv')"
          expected=$'open\t'"${RELEASE_SHA}"$'\t'"${GITHUB_REPOSITORY}"
          if [ "$snapshot" != "$expected" ]; then
            echo "A newer head or closed PR superseded this validation result."
            exit 0
          fi
          marker='<!-- anish-site-preview -->'
          url="https://pr-${PREVIEW_PR_NUMBER}.anish-shah-is.online"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${{ github.event.workflow_run.id }}"
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          printf '%s\nPreview: %s\n\nValidated SHA: `%s`\nStatus: **validation failed for this SHA**, so it was not deployed. The URL may still serve an older build.\nRun: %s\n' \
            "$marker" "$url" "$RELEASE_SHA" "$run_url" > "$body_file"
          body="$(cat "$body_file")"
          comment_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PREVIEW_PR_NUMBER}/comments" --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n 1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PREVIEW_PR_NUMBER}/comments" -f body="$body" >/dev/null
          fi

  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    steps:
      - name: Check out trusted deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up trusted repository toolchain
        uses: ./.github/actions/setup-repository
      - name: Revalidate the open PR and exact current head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          endpoint="repos/${GITHUB_REPOSITORY}/pulls/${PREVIEW_PR_NUMBER}"
          snapshot="$(gh api "$endpoint" --jq '[.state, .head.sha, .head.repo.full_name] | @tsv')"
          test "$snapshot" = $'open\t'"${EXPECTED_HEAD_SHA}"$'\t'"${GITHUB_REPOSITORY}"
      - name: Download the validated PR artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preview-build-${{ github.event.workflow_run.pull_requests[0].number }}-${{ github.event.workflow_run.head_sha }}
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan and prepare the read-only preview
        env:
          CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
          PREVIEW_CF_ACCESS_AUD: ${{ vars.PREVIEW_CF_ACCESS_AUD }}
          PREVIEW_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RELEASE_VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          npm run bundle:scan
          npm run preview:prepare
      - name: Capture production integrity guard
        id: production_guard_capture
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
        run: >-
          node scripts/preview-production-guard.mjs capture
          "${RUNNER_TEMP}/preview-production-guard.json"
      - name: Recheck the PR immediately before privileged deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          endpoint="repos/${GITHUB_REPOSITORY}/pulls/${PREVIEW_PR_NUMBER}"
          snapshot="$(gh api "$endpoint" --jq '[.state, .head.sha, .head.repo.full_name] | @tsv')"
          test "$snapshot" = $'open\t'"${EXPECTED_HEAD_SHA}"$'\t'"${GITHUB_REPOSITORY}"
      - name: Deploy the ephemeral preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
        run: npx --no-install wrangler deploy --config dist/server/wrangler.preview.json
      - name: Verify production integrity guard
        if: ${{ always() && steps.production_guard_capture.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
        run: >-
          node scripts/preview-production-guard.mjs verify
          "${RUNNER_TEMP}/preview-production-guard.json"
      - name: Smoke-test through preview Access
        env:
          ACCESS_CLIENT_ID: ${{ secrets.PREVIEW_ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.PREVIEW_ACCESS_CLIENT_SECRET }}
          EXPECTED_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          PREVIEW_ORIGIN: https://pr-${{ github.event.workflow_run.pull_requests[0].number }}.anish-shah-is.online
          PREVIEW_READINESS_TIMEOUT_MS: "90000"
        run: node scripts/preview-readiness.mjs
      - name: Update the persistent PR preview comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          endpoint="repos/${GITHUB_REPOSITORY}/pulls/${PREVIEW_PR_NUMBER}"
          snapshot="$(gh api "$endpoint" --jq '[.state, .head.sha, .head.repo.full_name] | @tsv')"
          expected=$'open\t'"${RELEASE_SHA}"$'\t'"${GITHUB_REPOSITORY}"
          if [ "$snapshot" != "$expected" ]; then
            echo "A newer head or closed PR superseded this deployment result."
            exit 0
          fi
          marker='<!-- anish-site-preview -->'
          url="https://pr-${PREVIEW_PR_NUMBER}.anish-shah-is.online"
          deployed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          printf '%s\nPreview: %s\n\nValidated SHA: `%s`\nDeployed: `%s`\nStatus: deployed and smoke-tested. Data is synthetic.\n' \
            "$marker" "$url" "$RELEASE_SHA" "$deployed_at" > "$body_file"
          body="$(cat "$body_file")"
          comment_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PREVIEW_PR_NUMBER}/comments" --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n 1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PREVIEW_PR_NUMBER}/comments" -f body="$body" >/dev/null
          fi
      - name: Mark the current preview SHA as failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          endpoint="repos/${GITHUB_REPOSITORY}/pulls/${PREVIEW_PR_NUMBER}"
          snapshot="$(gh api "$endpoint" --jq '[.state, .head.sha, .head.repo.full_name] | @tsv')"
          expected=$'open\t'"${RELEASE_SHA}"$'\t'"${GITHUB_REPOSITORY}"
          if [ "$snapshot" != "$expected" ]; then
            echo "A newer head or closed PR superseded this deployment failure."
            exit 0
          fi
          marker='<!-- anish-site-preview -->'
          url="https://pr-${PREVIEW_PR_NUMBER}.anish-shah-is.online"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          printf '%s\nPreview: %s\n\nValidated SHA: `%s`\nStatus: **failed for this SHA**. The URL may still serve an older build; do not review it as current.\nRun: %s\n' \
            "$marker" "$url" "$RELEASE_SHA" "$run_url" > "$body_file"
          body="$(cat "$body_file")"
          comment_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PREVIEW_PR_NUMBER}/comments" --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n 1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PREVIEW_PR_NUMBER}/comments" -f body="$body" >/dev/null
          fi
